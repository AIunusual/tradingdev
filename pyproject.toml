[project]
name = "tradingdev"
version = "0.1.0"
description = "MCP-first quantitative strategy development server"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vectorbt>=1.0.0",
    "quantstats>=0.0.86",
    "bokeh>=3.10.1",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "TA-Lib>=0.8.1",
    "pydantic>=2.13.4",
    "ccxt>=4.5.64",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "filelock>=3.29.5",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.7.2",
    # Architecture decision: ML packages needed to inspect/execute bundled
    # strategies stay in runtime dependencies so MCP and CLI paths can
    # validate/dry-run any bundled strategy without installing extras.
    # Dashboard packages (streamlit, plotly) are viewer-only and no MCP tool
    # ever imports them, so they live in the `dashboard` extra below instead.
    #
    # AutoML used to come from autogluon-tabular[all]. Every AutoGluon release
    # declares `Requires-Python: <3.14`, so it was the one dependency pip
    # hard-refuses on Python 3.14, and it dragged in torch, ray and spaCy
    # (~5.5 GB of wheels) for a tabular tree search. FLAML covers the same
    # search with no Python upper bound and no deep-learning stack, which
    # clears the way for `requires-python` to reach 3.14 once the remaining
    # pins are refreshed: this lock still carries numba 0.61, numpy 2.2.6 and
    # pyarrow 20, none of which ship 3.14 wheels, so widening the bound needs
    # a `uv lock --upgrade` of its own (pandas 2 -> 3) rather than a change
    # here. lightgbm and catboost are listed explicitly because they used to
    # arrive only transitively through AutoGluon, yet the model zoo imports
    # them directly.
    "xgboost>=3.1.3",
    "lightgbm>=4.5.0",
    "catboost>=1.2.7",
    "flaml>=2.7.0",
    "psutil>=7.1.3",
    "mcp[cli]>=1.28.1",
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.59.0",
    "plotly>=6.8.0",
]

[project.scripts]
tradingdev = "tradingdev.adapters.cli.main:main"
tradingdev-mcp = "tradingdev.mcp.server:main"
tradingdev-report = "tradingdev.adapters.cli.reports:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingdev"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "tradingdev/_quality/pyproject.toml"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["tradingdev"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[[tool.mypy.overrides]]
# Locked PyArrow 20.0.0 has no py.typed marker or stubs for the sample scanner.
module = ["pyarrow", "pyarrow.dataset"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "vectorbt.*",
    "ccxt.*",
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "sklearn.*",
    "pandas.*",
    "yaml.*",
    "plotly.*",
    "streamlit.*",
    "psutil.*",
    "joblib.*",
    "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# flaml ships a py.typed marker but re-exports AutoML from inside a try block
# and leaves most of its API unannotated, so mypy reports missing exports and
# untyped calls rather than anything actionable. Treat it as untyped instead.
module = ["flaml.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests, including real MCP subprocess workflows",
    "live_llm: explicitly enabled model/MCP workflows (--llm-provider codex|local)",
]

# Dev tools: [dependency-groups].dev is the canonical uv-native source.
# No [project.optional-dependencies].dev is maintained to avoid duplication.
[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    # Conversation tests verify rendered Markdown links, including code exclusions.
    "markdown-it-py>=4.2.0",
    # Markdown checks and explicit formatting share tooling/quality.py.
    "pymarkdownlnt>=0.9.38",
    "pytest>=9.1.1",
    "types-jsonschema>=4.26.0.20260518",
]
