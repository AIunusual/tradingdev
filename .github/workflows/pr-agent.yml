name: PR-Agent 初審

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type == 'User' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Use the base repository's workflow and the GitHub API for fork PRs.
      # Never check out or execute the PR head in this job.
      - name: 確認 PR 作者是此 repository 的協作者
        id: author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$PR_AUTHOR")
          case "$status" in
            204) echo 'eligible=true' >> "$GITHUB_OUTPUT" ;;
            404) echo '略過初審，PR 作者未列為協作者。' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::無法確認 PR 作者的協作者身分（HTTP $status）。"; exit 1 ;;
          esac

      - name: 審查目前的 PR 差異
        id: review
        if: steps.author.outputs.eligible == 'true'
        continue-on-error: true
        # Official 0.50.0-github_action image
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          CONFIG__USE_REPO_SETTINGS_FILE: "false"
          CONFIG__IGNORE_PR_TITLE: "[]"
          CONFIG__REPO_CONTEXT_FILES: '["docs/pr_review.md"]'
          CONFIG__RESPONSE_LANGUAGE: zh-TW
          CONFIG__NUM_RETRIES: "0"
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__PUBLISH_OUTPUT_PROGRESS: "false"
          PR_REVIEWER__REVIEW_HEADING: PR-Agent 初審
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          PR_REVIEWER__INLINE_KEY_ISSUES: "true"
          PR_REVIEWER__PERSISTENT_COMMENT: "true"
          PR_REVIEWER__PERSISTENT_FINDING_STATE: "true"
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: "false"
          PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT: "false"
          PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: "false"

      - name: 標記本次初審未完成
        if: steps.review.outcome == 'failure'
        run: |
          echo '::warning::PR-Agent 未完成初審。請查看審查步驟的錯誤。'
          echo '本次初審未完成。請查看審查步驟日誌以區分 API 額度、權限或服務錯誤，並核對既有留言對應的 commit。' >> "$GITHUB_STEP_SUMMARY"
